<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
__NNSLR_THEME__
<title>__NNSLR_TITLE__</title>
<style>
__NNSLR_SHARED_CSS__
/* Overview, Prepare, Train, Evaluate: one page, a tab each (web/src/pages/control.ts, web/src/control/ControlApp.vue). */
.live.off{color:var(--bad)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.banner{margin:0;padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.page>*{animation:tab-in .22s ease-out}
@keyframes tab-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page>section{min-width:0}
/* Prepare, Train: work running goes first, under the title; the last finished job stays at the bottom. */
.page>.banner{order:-3}.page>.page-head{order:-2}.page>.live-section.now{order:-1}
.section-title{display:flex;align-items:center;gap:8px;margin:6px 2px 8px;font-size:20px;font-weight:600;letter-spacing:-.018em;
color:var(--fg)}
.count-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--rev-soft);color:var(--rev);font-size:12px;
letter-spacing:0;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.live-section{display:flex;flex-direction:column;gap:12px}
.live-section>.section-title{margin-bottom:-2px}
.jp-list{display:flex;flex-direction:column;gap:12px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
/* Disabled buttons stay legible (flat, muted text): the reason next to them explains why. */
.loop-row .btn:disabled,.side .btn:disabled{opacity:1;background:transparent;border-color:var(--line);color:var(--muted)}
.loop-row .btn.primary:disabled{background:var(--accent-soft);border-color:var(--tab-on-ring);color:var(--tab-on-fg)}
.reason{margin:0}

/* Colour of a phase: blue review (an action), amber prepare (machine work waiting), green train / done. */
.k-review{--k:var(--rev);--k-soft:var(--rev-soft)}
.k-prepare{--k:var(--todo);--k-soft:var(--todo-soft)}
.k-train,.k-done{--k:var(--ok);--k-soft:var(--ok-soft)}
/* The Overview's running work (RunRow.vue): one row per job, a tap opens its sheet, Stop beside it. */
.run-card{display:flex;flex-direction:column;gap:4px;padding:14px 10px 10px}
.run-card .run-title{margin:0 12px 2px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.run-row{appearance:none;border:0;background:none;font:inherit;color:inherit;text-align:left;width:100%;display:flex;align-items:center;
gap:12px;padding:10px 12px;border-radius:12px;min-height:56px}
button.run-row{cursor:pointer;transition:background .15s}
button.run-row:hover{background:var(--surface-2)}
button.run-row:active{background:var(--surface-3)}
.run-icon{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--rev-soft)}
.run-row.failed .run-icon{background:var(--bad-soft);color:var(--bad);font-weight:800;font-size:17px}
.run-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.run-name{font-size:15.5px;font-weight:600;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-line{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
.run-row.failed .run-line{color:var(--bad);white-space:normal}
.run-bar{position:relative;height:4px;margin-top:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.run-bar span{display:block;height:100%;width:0;border-radius:2px;background:var(--rev);transition:width .6s ease}
.run-bar.indeterminate span{position:absolute;width:35%;animation:live-slide 1.4s ease-in-out infinite}
.run-chev{flex:none;color:var(--muted);font-size:20px}
.run-item{display:flex;align-items:center;gap:4px}
.run-item .run-row{flex:1;min-width:0}
.run-stop{flex:none;margin-right:6px}
@media (max-width:520px){.run-item:has(.run-stop) .run-chev{display:none}.run-item:has(.run-stop) .run-row{padding-right:4px}}
@media (prefers-reduced-motion:reduce){.run-bar span{transition:none}.run-bar.indeterminate span{animation:none}}

/* The loop of the work (Overview, LoopRows.vue): four numbered rows in their order, each with how much waits and its one
   button; a row with work waiting has its number in its phase's colour, the first of them a ring. */
.loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.loop-row{display:flex;flex-direction:column;gap:6px;min-width:0;padding:18px 20px;border-radius:18px;background:var(--surface);
box-shadow:var(--shadow)}
.loop-row.primary{box-shadow:0 0 0 2px var(--k),var(--shadow)}
.loop-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--muted);
text-decoration:none}
.loop-head::after{content:"›";margin-left:auto;letter-spacing:0;font-size:20px;line-height:1;opacity:.5;transition:transform .2s}
.loop-head:hover{color:var(--fg)}
.loop-head:hover::after{transform:translateX(3px);opacity:1}
.loop-num{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-3);
color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.loop-row.waiting .loop-num{background:var(--k);color:#fff}
.loop-big{font-size:22px;line-height:1.2;font-weight:600;letter-spacing:-.022em;font-variant-numeric:tabular-nums}
.loop-note{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.loop-note.warn-text{color:var(--warn)}
.loop-act{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;align-items:stretch;gap:6px}
.loop-act:empty{display:none}
.loop-act .btn{justify-content:center}
.loop-running{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:5px 11px;border-radius:12px;
background:var(--rev-soft);color:var(--rev);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.loop-running::before{content:"";width:7px;height:7px;flex:none;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
.loop-ok{align-self:flex-start;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);
font-weight:700}

/* Nothing running: a calm card. */
.idle{display:flex;align-items:center;gap:14px}
.idle-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--ok-soft);color:var(--ok)}
.idle-icon svg{width:24px;height:24px}
.idle.waiting .idle-icon{background:var(--surface-2);color:var(--muted)}
.idle-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.idle-text strong{font-size:16px}
.idle-text span{color:var(--muted);font-size:13.5px}

/* A job, live (JobProgress.vue): head, big percent, bar, what it is doing, the steps on the right. */
.jp{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;min-width:0;padding:20px 22px;border-radius:18px;
background:var(--surface);box-shadow:var(--shadow)}
.jp-running::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
background:linear-gradient(90deg,transparent,var(--rev),transparent);background-size:50% 100%;background-repeat:no-repeat;
animation:jp-scan 2.6s linear infinite}
@keyframes jp-scan{from{background-position:-100% 0}to{background-position:200% 0}}
.jp-head{display:flex;align-items:center;gap:12px;min-width:0}
.jp-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.jp-icon.run{background:var(--rev-soft);color:var(--rev)}
.jp-icon.ok{background:var(--ok-soft);color:var(--ok)}
.jp-icon.bad{background:var(--bad-soft);color:var(--bad)}
.jp-icon.warn{background:var(--warn-soft);color:var(--warn)}
.jp-icon svg{width:18px;height:18px}
.jp-icon .spinner{width:18px;height:18px}
.jp-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.jp-title h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jp-kicker{font-size:11.5px;font-weight:600;letter-spacing:0;color:var(--muted)}
.jp-when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* How the training was launched (panel._settings_of): chips under its title. */
.jp-settings{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.jp-settings li{padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;color:var(--fg);
font-variant-numeric:tabular-nums;white-space:nowrap}
.jp-settings li:first-child{font-weight:600}
.jp-body{display:grid;grid-template-columns:minmax(0,1fr);gap:18px 28px;align-items:start}
.jp.has-steps .jp-body{grid-template-columns:minmax(0,1fr) minmax(250px,320px)}
.jp-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.jp-figure{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 16px}
.jp-big{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.jp-big small{margin-left:2px;font-size:22px;font-weight:650;letter-spacing:-.01em;color:var(--muted)}
.jp-big-word{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.jp-running .jp-big-word{color:var(--rev)}
.jp-big-word.ok{color:var(--ok)}.jp-big-word.bad{color:var(--bad)}.jp-big-word.warn{color:var(--warn)}
.jp-eta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.jp-bar{position:relative;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.jp-bar span{position:relative;display:block;height:100%;width:0;border-radius:5px;overflow:hidden;
background:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.jp-running .jp-bar:not(.indeterminate) span::after{content:"";position:absolute;inset:0;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:jp-shine 2s ease-in-out infinite}
@keyframes jp-shine{to{transform:translateX(100%)}}
.jp-bar.ok span{background:var(--ok)}.jp-bar.bad span{background:var(--bad)}.jp-bar.warn span{background:var(--warn)}
.jp-bar.indeterminate span{position:absolute;width:35%;animation:live-slide 1.4s ease-in-out infinite}
@keyframes live-slide{0%{left:-35%}100%{left:100%}}
.jp-detail{margin:0;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.jp-stopped{margin:0;color:var(--bad);font-size:14px}
.jp-failure{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.jp-line{margin:0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden}
.jp-line.bad{color:var(--fg)}
.jp-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.jp-actions .btn{min-width:104px}
/* A button that stays on (Follow of the log sheet): tinted like the chosen tab. */
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sheet-outcome{margin:0 0 12px;font-size:15px;line-height:1.4}
.sheet-outcome small{display:block;margin-top:2px;font-size:13px;color:var(--muted)}

.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--rev);flex:none;
animation:live-spin .8s linear infinite}
@keyframes live-spin{to{transform:rotate(360deg)}}

/* The steps of a job (JobSteps.vue): a vertical timeline, done green with a check, current blue and pulsing. */
.jp-steps{list-style:none;margin:0;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);
display:flex;flex-direction:column}
.jp-steps li{position:relative;display:flex;align-items:flex-start;gap:10px;padding:5px 0;font-size:13.5px;color:var(--muted)}
.jp-steps li::after{content:"";position:absolute;left:10px;top:29px;bottom:-5px;width:2px;border-radius:1px;background:var(--line-strong)}
.jp-steps li:last-child::after{display:none}
.jp-steps li.done::after{background:var(--ok)}
.jp-mark{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
border:1.5px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.jp-mark svg{width:12px;height:12px}
.jp-step-body{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;column-gap:8px;align-items:baseline}
.jp-step-label{padding-top:2px;line-height:1.35;min-width:0}
/* The percent of each step: 100% when done, the count of the current one while it runs. */
.jp-step-pct{font-size:12px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.jp-steps li.current .jp-step-pct{color:var(--rev)}
.jp-step-bar{grid-column:1 / -1;height:4px;margin:6px 0 2px;border-radius:2px;background:var(--surface-3);overflow:hidden;position:relative}
.jp-step-bar span{display:block;height:100%;border-radius:2px;background:var(--rev);transition:width .6s ease}
.jp-step-bar.indeterminate span{position:absolute;width:30%;animation:jp-step-slide 1.4s ease-in-out infinite}
@keyframes jp-step-slide{0%{left:-30%}100%{left:100%}}
.jp-step-text{grid-column:1 / -1;font-size:12px;font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.jp-step-bar.indeterminate span{animation:none;left:0}}
.jp-steps li.done{color:var(--fg)}
.jp-steps li.done .jp-mark{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.jp-steps li.current{color:var(--fg);font-weight:650}
.jp-steps li.current .jp-mark{background:var(--rev);border-color:var(--rev);color:#fff;animation:jp-pulse 1.6s ease-out infinite}
@keyframes jp-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rev) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.jp-steps li.failed{color:var(--bad);font-weight:650}
.jp-steps li.failed .jp-mark{background:var(--bad);border-color:var(--bad);color:#fff}

/* The routes a preparation is working on. */
.prep-routes{list-style:none;margin:2px -10px 0;padding:0;display:flex;flex-direction:column;gap:2px}
.prep-drive{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:13px;padding:6px 10px;border-radius:10px;color:inherit;text-decoration:none}
a.prep-drive{cursor:pointer;transition:background .15s}
a.prep-drive:hover{background:var(--btn-2)}
a.prep-drive:active{background:var(--btn-2-hover)}
.prep-chev{margin-left:8px;color:var(--muted);font-size:16px;line-height:1}
.prep-routes .bar{grid-column:1/-1;height:6px}
.prep-route{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prep-phase{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
/* A phone: the drive's name on its own line, what it is doing under it, so neither cuts the other. */
@media (max-width:600px){.prep-drive{grid-template-columns:minmax(0,1fr)}.prep-phase{text-align:left}}

/* Prepare, Train: the card with the figure and the actions. */
.tab-card{display:flex;flex-direction:column;gap:16px}
.tab-card h2{margin:0 0 6px}
.tab-card-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.figure{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.figure-unit{margin-left:8px;font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted)}
.figure-note{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding:4px 12px;border-radius:999px;background:var(--todo-soft);color:var(--todo);font-size:13px}
.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.number{display:flex;flex-direction:column;gap:8px}
.number h2{margin:0}
.number .figure-note{margin:0}
.goal{display:flex;gap:4px}
.goal span{flex:1;height:8px;border-radius:4px;background:var(--surface-3)}
.goal span.on{background:var(--ok)}

/* The sparklines (components/Spark.vue). */
.spark{height:44px;margin:10px 0 6px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.spark svg{width:100%;height:100%;display:block}
/* The recent jobs, rows of an iOS list (JobItem.vue): the whole row opens the details. */
.card .list:has(.job-item){gap:0;margin:0 -10px}
.job-item{display:flex;align-items:center;gap:8px;border-radius:12px}
.job-item+.job-item{border-top:.5px solid var(--line-strong)}
.job-open{appearance:none;border:0;background:none;font:inherit;color:inherit;text-align:left;flex:1;min-width:0;display:flex;
align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer}
.job-open:hover{background:var(--surface-2)}
.job-open .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.job-open .what{font-weight:500;letter-spacing:-.01em}
.job-open .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.job-mark{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;
background:var(--muted)}
.job-mark.ok{background:var(--ok)}.job-mark.bad{background:var(--bad)}.job-mark.warn{background:var(--surface-3);color:var(--muted);font-size:9px}
.job-mark.run{background:none;border:2.5px solid var(--line-strong);border-top-color:var(--accent);animation:live-spin 1s linear infinite}
.job-go{color:var(--muted);font-size:20px;line-height:1;opacity:.5}
.side .note{margin:10px 0 0}

/* How a training is going (TrainingCharts.vue, charts/LineChart.vue): train blue, validation orange, the two
   first slots of the reference categorical palette of the dataviz method, validated on both surfaces. */
:root{--c-train:#3987e5;--c-val:#d95926}
:root[data-theme="light"]{--c-train:#2a78d6;--c-val:#eb6834}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--c-train:#2a78d6;--c-val:#eb6834}}
.training{display:flex;flex-direction:column;gap:18px}
.training>h2{margin:0}
.training-wait{display:flex;align-items:center;gap:16px;color:var(--muted)}
.training-wait svg{width:72px;height:48px;flex:none;color:var(--line-strong)}
.training-wait p{margin:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.training-wait strong{color:var(--fg);font-weight:600;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;min-width:0;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.tile-label{font-size:12.5px;color:var(--muted)}
.tile-value{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.tile-value small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--muted)}
.tile-note{font-size:12.5px;color:var(--muted)}
.net{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.net h3{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:16px;font-weight:700}
.net h3 span{font-size:13px;font-weight:400;color:var(--muted)}
.net-wait{margin:0;padding:18px;border-radius:14px;border:1px dashed var(--line-strong);color:var(--muted);font-size:14px;text-align:center}
.net-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px}
.chart{margin:0;min-width:0;padding:12px 14px 6px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.chart-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px;margin-bottom:4px}
.chart-title{font-size:13px;font-weight:600}
.chart-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.chart-key{display:inline-flex;align-items:center;gap:6px}
.chart-swatch{width:14px;height:2px;border-radius:1px}
.chart-plot{position:relative;min-width:0;border-radius:10px;touch-action:pan-y;cursor:crosshair}
.chart-plot svg{display:block;max-width:100%;overflow:visible}
.chart-grid line{stroke:var(--grid);stroke-width:1}
.chart-axis text,.chart-now text,.chart-best text,.chart-end{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart-best text,.chart-end{fill:var(--fg);font-weight:600}
.chart-now rect{fill:var(--accent-soft)}
.chart-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-dot{stroke:var(--surface);stroke-width:2}
.chart-best circle{fill:none;stroke-width:1.5}
.chart-best text{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart-cross{stroke:var(--line-strong);stroke-width:1}
.chart-empty{position:absolute;inset:16px 64px 26px 46px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.chart-tip{position:absolute;top:6px;z-index:2;min-width:132px;padding:8px 10px;border-radius:10px;pointer-events:none;
background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--tip-shadow);font-size:12.5px;transform:translateX(12px)}
.chart-tip.flip{transform:translateX(calc(-100% - 12px))}
.chart-tip-head{margin-bottom:4px;color:var(--muted)}
.chart-tip-row{display:flex;align-items:center;gap:8px;white-space:nowrap}
.chart-tip-row strong{min-width:46px;font-variant-numeric:tabular-nums}
.chart-tip-row span:last-child{color:var(--muted)}
.chart-tip-key{width:12px;height:2px;border-radius:1px;flex:none}
.chart-table summary{cursor:pointer;width:max-content;color:var(--muted);font-size:13.5px}
.chart-table summary:hover{color:var(--fg)}
.chart-table table{margin-top:6px;font-size:13px}
.chart-table caption{padding:10px 0 4px;text-align:left;font-weight:600}
.chart-table th,.chart-table td{padding:6px 10px}

/* The actions (ActionList.vue): one card each, the whole card the button: icon, label, one sentence, and why
   not now (amber) when it cannot start; a dashed outline when it is off. */
.acts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px}
.act{display:flex;min-width:0}
.act-card{appearance:none;font:inherit;color:inherit;text-align:left;width:100%;display:flex;align-items:center;gap:14px;
padding:14px 16px;border-radius:14px;border:0;background:var(--surface-2);cursor:pointer;min-height:72px;
transition:background .2s,transform .1s}
.act-card:hover:not(:disabled){background:var(--surface-3)}
.act-card:active:not(:disabled){transform:scale(.99)}
.act-icon{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--accent);color:#fff}
.act-icon .icon{width:20px;height:20px}
.act-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.act-label{font-weight:600;font-size:15.5px;letter-spacing:-.012em}
.act-text{color:var(--muted);font-size:13.5px;line-height:1.4}
.act-reason{color:var(--muted);font-size:13px;line-height:1.4}
.act-go{align-self:center;color:var(--muted);font-size:20px;line-height:1;opacity:.5;transition:transform .2s,opacity .2s}
.act-go::before{content:"›"}
.act-card:hover:not(:disabled) .act-go{transform:translateX(2px);opacity:.9}
.act-card:disabled{cursor:default;background:var(--surface-2);opacity:.6}
.act-card:disabled .act-icon{background:var(--surface-3);color:var(--muted)}
.act-card:disabled .act-label{color:var(--fg)}
.act-card:disabled .act-go{visibility:hidden}

/* Train a model (TrainStart.vue): where it starts, one card each (a small drawing, label, sentence, the
   reason when it is not available), then Start training. */
.train-start{display:flex;flex-direction:column;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.ts-head{display:flex;align-items:flex-start;gap:14px}
.ts-title{margin:0;font-size:15.5px;font-weight:700}
.ts-text{margin:3px 0 0;color:var(--muted);font-size:13.5px;max-width:80ch}
.starts{margin:0;padding:0;border:0;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.ts-legend{padding:0;margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted)}
.start{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;padding:14px;border-radius:16px;
border:1px solid var(--line-strong);background:var(--surface-2);cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.start:hover{border-color:var(--hover-line)}
.start input{position:absolute;opacity:0;pointer-events:none}
.start.on{border-color:var(--accent);background:var(--card-grad),var(--surface);box-shadow:0 0 0 1px var(--accent),0 10px 28px var(--accent-soft)}
.start:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.start.off{cursor:not-allowed;background:transparent;border-style:dashed}
.start-art{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.start-art .icon{width:28px;height:28px}
.start.off .start-art{background:var(--surface-2);color:var(--muted)}
.start-body{display:flex;flex-direction:column;gap:4px;min-width:0;padding-right:26px}
.start-label{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:700;font-size:15px}
.start.off .start-label{color:var(--muted)}
.start-tag{padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:11.5px;font-weight:600}
.start-text{color:var(--muted);font-size:13px;line-height:1.4}
.start-reason{display:inline-block;margin-top:4px;color:var(--todo)}
.start-check{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.start-check svg{width:16px;height:16px}
.start.on .start-check{opacity:1;transform:none}
.ts-go{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.ts-go .btn{min-width:220px}
.ts-go .btn.primary:disabled{opacity:1;background:var(--accent-soft);border-color:var(--tab-on-ring);color:var(--tab-on-fg);box-shadow:none}
.ts-go .reason{font-size:13px;color:var(--todo)}
.ts-from{margin:0;color:var(--muted);font-size:13.5px}
.ts-from strong{color:var(--fg);font-weight:600}
.figure-link{margin-left:4px;color:var(--rev);text-decoration:none;white-space:nowrap}
.figure-link:hover{text-decoration:underline;text-underline-offset:2px}



/* What the dataset holds (DatasetSection.vue): figures, bar lists, the split as one stacked bar, the routes.
   The split takes the first five slots of the reference categorical palette (validated, both themes): train
   and validation are the blue and orange of the training charts. */
:root{--split-3:#199e70;--split-4:#c98500;--split-5:#d55181}
:root[data-theme="light"]{--split-3:#1baf7a;--split-4:#eda100;--split-5:#e87ba4}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--split-3:#1baf7a;--split-4:#eda100;--split-5:#e87ba4}}
.dataset{display:flex;flex-direction:column;gap:18px;scroll-margin-top:140px}
.ds-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.ds-head h2{margin:0}
.ds-when{margin-left:10px;font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ds-head .ds-when{margin:0}
.ds-figures{display:flex;flex-wrap:wrap;gap:8px 32px}
.ds-figure{display:flex;align-items:baseline;gap:8px}
.ds-value{font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.ds-unit{font-size:15px;color:var(--muted)}
.ds-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 36px}
.ds-block{display:flex;flex-direction:column;gap:10px;min-width:0}
.dataset>.ds-grid,.dataset>.ds-block{padding-top:16px;border-top:1px solid var(--line)}
.ds-title{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted)}
.ds-block .ds-title:not(:first-child){margin-top:12px}
.barlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.barlist li{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:13.5px}
.barlist.share li{grid-template-columns:minmax(96px,34%) minmax(0,1fr) 104px}
.bl-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-track{height:10px;border-radius:0 4px 4px 0;background:color-mix(in srgb,var(--surface-3) 70%,transparent)}
.bl-track span{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--series)}
.bl-value{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bl-value small{margin-left:6px;font-size:12px;font-weight:500;color:var(--muted)}
.ds-import p{margin:0;font-size:14px}
.ds-import .ds-warn{margin-top:8px;padding:10px 12px;border-radius:12px;font-size:13.5px;background:var(--warn-soft);
border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.split-bar{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden}
.split-bar span{flex-basis:0;min-width:3px}
.split-1{background:var(--c-train)}.split-2{background:var(--c-val)}.split-3{background:var(--split-3)}
.split-4{background:var(--split-4)}.split-5{background:var(--split-5)}.split-0{background:var(--line-strong)}
.split-legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px}
.split-legend li{display:inline-flex;align-items:center;gap:7px}
.split-legend strong{font-weight:650;font-variant-numeric:tabular-nums}
.split-share{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.split-key{width:10px;height:10px;border-radius:3px;flex:none}
.dataset .note{margin:0;font-size:13px;max-width:90ch}
.ds-routes{font-size:13.5px}
.ds-routes td,.ds-routes th{padding:8px 10px}
.ds-routes tfoot th,.ds-routes tfoot td{border-top:1px solid var(--line-strong);border-bottom:0;font-weight:650;color:var(--fg);
text-transform:none;letter-spacing:0;font-size:13.5px}

/* The details of a job in the sheet: a summary line, the steps, the log as plain text. */
.sheet .jp-steps{padding:10px 14px}

/* Pills: 'to review' neutral and 'to import' green, both with a hollow dot (not done yet). */
.pill.hollow::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}

/* Routes table: the route column has a fixed width, numbers right-aligned. */
.table-card{padding:18px 0 4px}
.table-card h2{padding:0 20px}
.table-card table{table-layout:fixed}
col.c-route{width:200px}
col.c-seg{width:100px}
col.c-frames{width:120px}
col.c-objects{width:124px}
col.c-state{width:228px}
.table-card th{overflow:hidden;text-overflow:ellipsis}
.table-card th:first-child,.table-card td:first-child{padding-left:20px}
.table-card th:last-child,.table-card td:last-child{padding-right:20px}
.table-card tbody tr:hover td{background:var(--accent-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.route{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.route a{font-family:var(--font-data);font-size:12.5px;color:var(--fg);text-decoration:none}
td.route a:hover{color:var(--rev);text-decoration:underline;text-underline-offset:2px}
td.none{color:var(--muted)}
/* Bar, then the count in a fixed right-aligned slot, so every bar ends at the same x. */
.reviewed{display:flex;align-items:center;gap:10px}
.reviewed .bar{flex:1;min-width:40px}
.reviewed .num{flex:none;width:11ch;font-size:12.5px;color:var(--muted)}
td .note{display:block;margin-top:4px;font-size:12px}
.table-card .empty{padding:0 20px 14px}

/* Evaluate (EvaluateTab.vue and its sections): the runs as a table (a row opens the run), the run in detail, the
   reader per label, the detector per sign size, the split, experiment B, two runs compared. Only the tokens of
   shared.css and the series colours above, so both themes follow. */
.muted{color:var(--muted)}
.runs-card,.eval-card,.run-detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.runs-card{gap:12px}
.runs-card .count-badge{margin-left:8px;vertical-align:1px}
.eval-card>.ds-block{padding-top:16px;border-top:1px solid var(--line)}
.eval-what{margin-left:10px;font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.run-empty{display:flex;align-items:center;gap:14px}
.run-empty .idle-icon{background:var(--accent-soft);color:var(--accent)}
.run-empty .flow-link{margin-top:6px;width:max-content}
.runs{font-size:13.5px}
.runs th,.runs td{padding:10px}
.runs td{vertical-align:top}
.runs tbody tr{cursor:pointer}
.runs tbody tr:hover td{background:var(--surface-2)}
.runs tbody tr.on td{background:var(--accent-soft)}
.runs tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.run-name{appearance:none;border:0;background:none;padding:0;font:inherit;font-weight:650;color:var(--fg);cursor:pointer;
font-variant-numeric:tabular-nums;text-align:left;border-radius:4px}
.run-name:hover{color:var(--rev)}
.run-sub{display:block;margin-top:2px;font-size:12px;font-weight:400;color:var(--muted);white-space:normal}
.runs td.num .run-sub{white-space:nowrap}
.runs .pill{margin-bottom:1px}
.run-none{color:var(--muted);font-size:13px}
.run-detail{scroll-margin-top:140px}
.rd-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rd-title{display:flex;flex-direction:column;gap:1px;min-width:0}
.run-detail .rd-title h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-transform:none;color:var(--fg);
font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rd-where{margin:0;font-size:14.5px;font-weight:600}
.rd-where.running{color:var(--rev)}.rd-where.finished{color:var(--ok)}.rd-where.incomplete{color:var(--warn)}
.rd-error{margin:0}
.rd-error code{display:block;padding:8px 10px;white-space:pre-wrap;word-break:break-word;border-color:var(--error-line)}
.run-detail>.note{margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px;margin:0}
.facts>div{min-width:0}
.facts dt{font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted)}
.facts dd{margin:3px 0 0;font-size:14px;overflow-wrap:anywhere}
.route-code{display:inline-block;margin:0 6px 4px 0}
/* A choice of two or three (Segmented.vue), marked as the tabs of the top bar. */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;width:max-content;max-width:100%;background:var(--seg-bg);border-radius:10px}
.seg button{appearance:none;border:0;background:none;color:var(--fg);font:inherit;font-weight:500;font-size:13.5px;padding:5px 14px;
border-radius:8px;cursor:pointer;min-height:30px;opacity:.85;transition:background .2s,box-shadow .2s}
.seg button:hover{opacity:1}
.seg button[aria-checked="true"]{opacity:1;font-weight:600;background:var(--seg-on);box-shadow:var(--seg-on-shadow)}
.seg button:disabled{cursor:default}.seg button:disabled:not([aria-checked="true"]){opacity:.4}
.seg-row{display:flex;flex-wrap:wrap;gap:8px 12px}
/* Train as an app: one line of data, the networks in a switcher, one card whose slot is the button or the progress. */
/* Training's line of data (TrainTab.vue): a link to Data › Dataset, as an iOS row with its chevron. */
.data-strip{display:flex;align-items:center;gap:14px;padding:14px 18px;color:inherit;text-decoration:none;transition:background .15s}
.data-strip:hover{background:var(--surface-2)}
.data-texts{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.data-line,.data-new{font-size:14px;line-height:1.4}
.data-line{margin-right:auto}
.data-new{color:var(--accent);font-size:13.5px}
.data-new.muted{color:var(--muted)}
.data-new.warn{color:var(--warn);font-size:13px}
.data-chev{color:var(--muted);font-size:20px;line-height:1}
/* Results › Drive (DriveView.vue): a drive replayed as in the car, on one screen: the frame (as tall as the window
   leaves), the drive at a glance at its side, the strip of the drive under it. */
.results-mode{margin-top:-6px}
.drive{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.drive-bar{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;align-items:center;gap:10px}
.drive-why{margin:0;font-size:13px;color:var(--muted)}
.drive-main{display:grid;grid-template-columns:minmax(0,1fr) 230px;grid-template-areas:"stage side" "time time";gap:12px 16px;align-items:start}
.drive-stage{grid-area:stage;position:relative;width:min(100%,calc((100dvh - 400px) * 1344 / 760));min-width:min(100%,420px);
justify-self:center;border-radius:12px;overflow:hidden;background:#000;cursor:pointer;outline-offset:3px}
.drive-stage img,.drive-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;display:block}
.drive-making{position:absolute;left:12px;bottom:12px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;
font-size:12.5px;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.drive-mark rect{fill:none}
.drive-mark text{font-weight:800;paint-order:stroke;stroke:rgba(0,0,0,.75);font-family:inherit}
.drive-mark.right rect{stroke:#30d158}.drive-mark.right text{fill:#30d158}
.drive-mark.wrong rect{stroke:#ff9f0a}.drive-mark.wrong text{fill:#ff9f0a}
.drive-mark.false rect{stroke:#ff453a}.drive-mark.false text{fill:#ff453a}
.drive-mark.missed rect{stroke:#fff;opacity:.9}.drive-mark.missed text{fill:#fff}
/* The limit as the car shows it: a round sign, red ring on white; under it what the signs say. */
.drive-hud{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 10px 8px;
border-radius:16px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
box-shadow:0 0 0 2px transparent;transition:box-shadow .2s}
.drive-hud.right{box-shadow:0 0 0 2px #30d158}.drive-hud.wrong{box-shadow:0 0 0 2px #ff453a}
.drive-sign{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;
border:7px solid #e0242b;font-size:26px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.drive-sign.end{border-color:#888;font-size:16px;background:linear-gradient(135deg,#fff 44%,#555 44%,#555 56%,#fff 56%)}
.drive-sign.empty{border-color:#666;color:#666}
.drive-truth{font-size:12px;color:rgba(255,255,255,.8)}.drive-truth b{color:#fff;font-variant-numeric:tabular-nums}
.drive-side{grid-area:side;display:flex;flex-direction:column;gap:14px}
.drive-big{display:flex;flex-direction:column;gap:2px}
.drive-big strong{font-size:44px;font-weight:750;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.drive-big span{font-size:13px;color:var(--muted)}
.drive-facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.drive-facts b{font-variant-numeric:tabular-nums;color:var(--ok)}
.drive-facts-head{color:var(--muted);font-size:12.5px}
.drive-facts .wrong b{color:var(--warn)}.drive-facts .missed b{color:var(--muted)}.drive-facts .false b{color:var(--bad)}
.drive-now{margin:0;font-size:13.5px;color:var(--muted)}
.drive-now.right b{color:var(--ok)}.drive-now.wrong b{color:var(--bad)}
.drive-legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:12px;color:var(--muted)}
.drive-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:2px solid}
.drive-legend .right{border-color:#30d158}.drive-legend .wrong{border-color:#ff9f0a}.drive-legend .false{border-color:#ff453a}
.drive-legend .missed{border-color:var(--muted);border-style:dashed}
.drive-time{grid-area:time;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"play strip speed" ". pos .";
align-items:center;gap:4px 12px}
.drive-play{grid-area:play;min-width:96px;justify-content:center}
.drive-strip{grid-area:strip;width:100%;height:30px;cursor:pointer;touch-action:none;display:block}
.drive-strip .right{fill:var(--ok)}.drive-strip .wrong{fill:var(--bad)}.drive-strip .none{fill:var(--surface-3)}
.drive-strip .tick-model{stroke:var(--fg);stroke-width:.6;opacity:.7}.drive-strip .tick-truth{stroke:var(--muted);stroke-width:.6}
.drive-strip .head{fill:var(--accent)}
.drive-speed{grid-area:speed}
.drive-pos{grid-area:pos;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
@media (max-width:860px){
  .drive-main{grid-template-columns:1fr;grid-template-areas:"stage" "time" "side"}
  .drive-stage{width:100%;min-width:0}
  .drive-bar{grid-template-columns:minmax(0,1fr) auto}
  /* The classifier's button only its time (and In use): the drive gets the width; its cutter is in the sheet. */
  #drive-source .picker-sub{display:none}
  .drive-bar{align-items:stretch}
  .drive{padding:14px}
  .drive-bar .picker{padding:7px 24px 7px 11px}
  .drive-bar .picker-chev{right:8px}
  .drive-bar .picker-title{font-size:14.5px}
  .drive-part{grid-column:1/-1;width:100%;display:grid;grid-template-columns:1fr 1fr}
  .drive-time{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"pos pos" "strip strip" "play speed";gap:6px 10px}

border:1px solid var(--line-strong);box-shadow:var(--pop-shadow);overflow:hidden}

.publish h2 .h2-aside{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}

.car-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.car-row{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:10px 14px;
border-radius:12px;background:var(--surface-2);min-width:0}

.acc-bar span{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--series)}

.box-counts strong{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}

   the classifier lets a false box through, faded when it throws it away. */
.watch{--wp-found:#4ade80;--wp-junk:#b4bcc8;--wp-survives:#ff4d4f;--wp-warn:#fbbf24}
.wp-pick{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px}

border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;min-height:40px;min-width:min(320px,100%);max-width:100%;width:100%;
text-overflow:ellipsis}
.wp-field output{font-family:var(--font-data);font-size:13px;letter-spacing:0;color:var(--fg)}

.wp-stage img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}

.wp-box.found{stroke:var(--wp-found)}

.wp-box.rejected{stroke:var(--wp-junk);opacity:.32}

/* Data › Roads, parking and the loop of a check (RoadDrive.vue). Parking is the violet of the reference palette, stepped
   for each theme: with the four others every pair passes the validator in both themes (all pairs, as any type can follow
   any other: colour-blind ΔE ≥ 8.9, normal ≥ 15.5) and it clears 3:1 on the dark card. Unknown is a solid grey, 3.4:1 on
   the dark card (half see-through it was 2.5:1), as light as before on the light one. On the strip of a drive an orange
   line under the stretches to check (the colour of Next to check), the dark one under those a person set, the blue one
   over the stretch a tap sets; the type buttons and Next to check right under the picture, the speeds, Mark start, Undo
   and the legend under them; 44 px targets on a touch screen; a phone held sideways puts the buttons beside the picture. */
:root{--rt-parking:#8a57ae;--rt-unknown:#6e6e73;--rt-ramp:#1fb3c9}
:root[data-theme="light"]{--rt-parking:#744399;--rt-unknown:#8e8e93;--rt-ramp:#0b8597}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--rt-parking:#744399;--rt-unknown:#8e8e93;--rt-ramp:#0b8597}}
/* A ramp: cyan, the light side of the motorway's blue, so the strip shows where a motorway is entered and left. */
.rt-parking{background:var(--rt-parking)}.rt-unknown{background:var(--rt-unknown);opacity:1}.rt-ramp{background:var(--rt-ramp)}
.rt-track .rt-parking{fill:var(--rt-parking)}.rt-track .rt-ramp{fill:var(--rt-ramp)}.rt-track .rt-unknown{fill:var(--rt-unknown)}.rt-track .rt-tocheck{fill:var(--bad)}
/* A 30 zone: one khaki for both themes, an earth tone beside the town's amber. Against every other type it passes the
   same validator in both themes (normal ΔE ≥ 18, colour-blind ≥ 10.5 under the three kinds) and clears 3:1 on both
   cards. */
:root{--rt-zone30:#99905c}
.rt-zone30{background:var(--rt-zone30)}.rt-track .rt-zone30{fill:var(--rt-zone30)}
/* A garage (a car park underground or indoors): magenta, stepped for each theme. Eight kinds fill the palette: against
   every other type the normal ΔE is ≥ 17 in both themes and it clears 3:1 on both cards, but the colour-blind ΔE against
   the motorway's blue is 7.0 (dark) and 6.9 (light), the floor band the validator allows only with a second cue: the
   strip's gaps and tips, the shares and the chip in words. */
:root{--rt-garage:#e830e8}
:root[data-theme="light"]{--rt-garage:#d02cd0}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--rt-garage:#d02cd0}}
.rt-garage{background:var(--rt-garage)}.rt-track .rt-garage{fill:var(--rt-garage)}
/* The acceleration lane after an entry ramp: no ninth hue (the palette is full) but the two it joins, the ramp's cyan
   over the motorway's blue, a two-tone key no other type has; on the strip a gradient of hard stops (RoadDrive.vue), as
   the SVG is stretched. */
.rt-merge{background:linear-gradient(to bottom,var(--rt-ramp) 0 40%,var(--c-train) 40%)}
.rt-track .rt-merge{fill:url(#rt-merge-fill)}
.rt-merge-top{stop-color:var(--rt-ramp)}.rt-merge-bottom{stop-color:var(--c-train)}
.rt-view-main{grid-template-rows:auto 1fr}
.rt-fix-head{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.rt-pick button:last-child{grid-column:auto}
.rt-more{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.rt-more .rt-speed{margin-left:0}
.rt-marks{gap:6px 14px;font-size:12.5px}
.rt-line{width:14px;height:3px;border-radius:2px;flex:none}
.rt-line.rt-tocheck{background:var(--bad)}.rt-line.rt-done{background:var(--fg)}.rt-line.rt-marked{background:var(--accent)}
.rt-left{white-space:nowrap}
@media (max-width:860px){
  .rt-view-main{grid-template-rows:none}
  .rt-pick{grid-template-columns:repeat(6,minmax(0,1fr))}
}

  .rt-view .rt-back{min-height:44px;min-width:44px;margin:-10px 0 -8px -6px;padding:0 6px}
  .rt-view .btn.rt-play,.rt-view .btn.rt-step,.rt-view .rt-fix-row .btn,.rt-view .btn.rt-next{min-height:44px}
  .rt-view .btn.rt-step{min-width:48px;justify-content:center}

    gap:10px 16px}
  .rt-stage{width:min(100%,calc((100dvh - 124px) * 1344 / 760));min-width:0}
  .rt-side{gap:8px}

/* The part of a stretch a tap sets (RoadDrive.vue): the whole stretch, up to the picture shown, or from it. */
.rt-part{display:flex;width:100%;margin:2px 0 8px}.rt-part button{flex:1 1 0;min-width:0;white-space:nowrap}

/* The type buttons of a correction (RoadDrive.vue): pills one can see are buttons, not a legend; the type the map
   proposes has a dashed ring, the one a person set a solid one. */
.rt-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0;background:none}
.rt-pick .rt-type{justify-content:center;gap:7px;min-height:44px;padding:8px 10px;font-size:14.5px;white-space:nowrap}

.rt-pick button.rt-map{outline:1.5px dashed var(--muted);outline-offset:-5px}
.rt-fix-head strong{font-size:15px}
/* Nine types in rows of four, each button its dot over its word, and Can't tell across the rest of the last row; in the
   one column of a tablet, wide enough, each dot beside its word. */
.rt-pick{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rt-pick .rt-type,.rt-pick .rt-type:last-child{flex-direction:column;gap:4px;padding:6px 0;font-size:12px}

/* The cut of a stretch (RoadDrive.vue): a short title over Whole / Before / After, and the cut drawn on the strip. */
.rt-cut-head{margin:0 0 6px;font-size:13px;color:var(--muted);line-height:1.35}
.rt-cut-head strong{color:var(--fg);font-size:14.5px;margin-right:4px}
.rt-track .rt-cut{fill:var(--surface);stroke:var(--fg);stroke-width:0.6}
/* The junctions of a drive (RoadDrive.vue): a row of dots under the strip, round in HTML (the strip's SVG is stretched):
   a solid dot a junction (the map's or a person's), an orange ring one to check (Next to check stops there, the orange
   of its count), a grey ring one that is not (a person said so, or the map's on another road). Under the type buttons
   the junction at the picture shown and Junction here / Not a junction / Undo, the same pills as the types. */
.rt-scrub{position:relative;display:flex;flex-direction:column;gap:3px;cursor:pointer;touch-action:none}
.rt-jrow{position:relative;height:10px}
.rt-jdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--fg);box-sizing:border-box;flex:none}
.rt-jrow .rt-jdot{position:absolute;top:0;margin-left:-4.5px}
.rt-jdot.check{background:var(--surface);border:2px solid var(--todo)}
.rt-jhead{position:absolute;top:-3px;bottom:0;width:2px;margin-left:-1px;border-radius:1px;background:var(--fg)}
.rt-jdot.not{background:transparent;border:1.5px solid var(--muted)}
.rt-jx{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.rt-jx-head{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.rt-jx-undo{margin-left:auto;font-size:13.5px}
.rt-jx-head strong{font-size:15px;font-weight:600}
.rt-jx-head span{font-size:13px;color:var(--muted)}
.rt-jx-head span.rt-jx-doubt{color:var(--todo);font-weight:600}
.rt-jx-why{margin:-4px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.rt-jx-pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.rt-jx-pick .rt-type{justify-content:center;gap:7px;min-height:44px;padding:8px 10px;font-size:14.5px;white-space:nowrap}
.rt-jx-pick .rt-type[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg) inset}
.rt-jx-pick button.rt-map{outline:1.5px dashed var(--muted);outline-offset:-5px}

@media (max-height:500px) and (min-width:600px){.rt-jx{gap:6px;padding-top:8px}.rt-jx-pick .rt-type{min-height:38px;font-size:12.5px;padding:4px 6px}}
/* The position on the strip of a drive (RoadDrive.vue): a line with a round knob on top, in HTML (the SVG is stretched),
   ringed in the card's colour so it stands out on every type; room above for the knob, the time over it while a strip is
   dragged. On a long drive a frame round the stretch of the close strip under it: the minute or two around the picture,
   five pixels a picture, on a grey ground past the ends of the drive, a notch every 10 pictures and a long one every
   60 so a drag along one type shows it moves, the line of the picture wanted in its middle. A finger moves it sideways;
   up or down the page scrolls. */
.rt-scrub{padding-top:12px}
.rt-bar{position:relative}
.rt-knob{position:absolute;top:-5px;bottom:-2px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--fg);

.rt-bubble{position:absolute;bottom:calc(100% + 14px);transform:translateX(-50%);padding:3px 10px;border-radius:999px;background:var(--fg);
